			<div class="finder-left-pane">
				<section class="finder-upper-pane" aria-label="Selected project preview">
					<div class="finder-preview-stage">
						<a class="finder-preview" href="/projects/bah" aria-label="Open Mission Support project">
							<span class="ios-file-icon ios-file-icon--blue" aria-hidden="true">
								<svg viewBox="0 0 84 100"><path class="file-sheet" d="M13 3h39l20 20v70a4 4 0 0 1-4 4H13a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/><path class="file-fold" d="M52 3v16a4 4 0 0 0 4 4h16Z"/><rect x="20" y="37" width="42" height="5" rx="2.5"/><rect x="20" y="49" width="35" height="4" rx="2"/><rect x="20" y="59" width="39" height="4" rx="2"/><rect x="20" y="69" width="27" height="4" rx="2"/></svg>
							</span>
						</a>
					</div>
				</section>
				<section class="finder-project-pane" aria-label="Choose a project preview">
					<div class="ios-file-grid">
						<button class="ios-file-item" type="button" data-project="bah" data-href="/projects/bah" data-label="Mission-support application" data-description="UX design and product ownership for a complex operational tool" data-work-type="Professional work" data-work-type-class="professional" aria-label="Preview Mission Support project" aria-pressed="true">
							<span class="ios-file-icon ios-file-icon--blue" aria-hidden="true">
								<svg viewBox="0 0 84 100"><path class="file-sheet" d="M13 3h39l20 20v70a4 4 0 0 1-4 4H13a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/><path class="file-fold" d="M52 3v16a4 4 0 0 0 4 4h16Z"/><rect x="20" y="37" width="42" height="5" rx="2.5"/><rect x="20" y="49" width="35" height="4" rx="2"/><rect x="20" y="59" width="39" height="4" rx="2"/><rect x="20" y="69" width="27" height="4" rx="2"/></svg>
							</span>
						</button>
						<button class="ios-file-item" type="button" data-project="otw" data-href="/projects/otw" data-label="On The Way" data-description="End-to-end product design for a route-aware navigation experience" data-work-type="Selected earlier work" data-work-type-class="earlier" aria-label="Preview On The Way project" aria-pressed="false">
							<span class="ios-file-icon ios-file-icon--cyan" aria-hidden="true">
								<svg viewBox="0 0 84 100"><path class="file-sheet" d="M13 3h39l20 20v70a4 4 0 0 1-4 4H13a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/><path class="file-fold" d="M52 3v16a4 4 0 0 0 4 4h16Z"/><path d="M22 67c8-2 8-20 17-20s8 18 17 16" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="22" cy="67" r="4"/><circle cx="39" cy="47" r="4"/><circle cx="56" cy="63" r="4"/><rect x="20" y="32" width="36" height="4" rx="2"/></svg>
							</span>
						</button>
						<button class="ios-file-item" type="button" data-project="bttf" data-href="/projects/bttf" data-label="Back to the Future" data-description="UX research and interaction design to enable music sharing in Spotify" data-work-type="Selected earlier work" data-work-type-class="earlier" aria-label="Preview Back to the Future project" aria-pressed="false">

	</main>
	<script>
		(() => {
			const preview = document.querySelector('.finder-preview');
			const previewIcon = preview?.querySelector('.ios-file-icon');
			const projectButtons = document.querySelectorAll('.finder-project-pane .ios-file-item');
			if (!preview || !previewIcon || !projectButtons.length) return;
			const modifiedRow = document.querySelector('.finder-modified-row');
			if (modifiedRow) modifiedRow.hidden = !document.querySelector('.finder-project-pane .ios-file-item[data-project="bah"][aria-pressed="true"]');
			projectButtons.forEach((button) => {
				button.addEventListener('click', () => {
					const selectedIcon = button.querySelector('.ios-file-icon');
					if (!selectedIcon) return;
					previewIcon.className = selectedIcon.className;
					previewIcon.innerHTML = selectedIcon.innerHTML;
					preview.href = button.dataset.href;
					preview.setAttribute('aria-label', 'Open ' + button.dataset.label + ' project');
					const selectedLabel = document.querySelector('.finder-selected-label');
					if (selectedLabel) selectedLabel.textContent = button.dataset.label;
					const selectedDescription = document.querySelector('.finder-selected-description');
					if (selectedDescription) selectedDescription.textContent = button.dataset.description || 'UX design and product ownership for a complex operational tool';
					const modifiedRow = document.querySelector('.finder-modified-row');
					if (modifiedRow) modifiedRow.hidden = button.dataset.project !== 'bah';
					const workTag = document.querySelector('.finder-work-tag');
					if (workTag) {
						workTag.textContent = button.dataset.workType || 'Professional work';
						workTag.className = 'finder-work-tag finder-work-tag--' + (button.dataset.workTypeClass || 'professional');
					}
					projectButtons.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
				});
			});
		})();
	</script>
	<script type="module" src="script.js"></script>
